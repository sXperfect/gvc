name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: ["opened", "synchronize", "reopened", "ready_for_review"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3.8 — minimum supported interpreter
        uses: actions/setup-python@v7
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Python 3.8 core and optional surfaces
        run: |
          python -m pip install --upgrade "pip<25.1"
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,all]"
          python scripts/ci.py all
          python scripts/ci.py optional

      - name: Clean build products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build *.egg-info gvc.egg-info

      - name: Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Python 3.9 newest-resolvable stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,all]"
          python scripts/ci.py test
          python scripts/ci.py optional
          python scripts/ci.py deps

      - name: Clean build products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build *.egg-info gvc.egg-info

      - name: Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Python 3.10 full gate
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,all]"
          python scripts/ci.py all
          python scripts/ci.py optional

      - name: Clean build products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build *.egg-info gvc.egg-info

      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Python 3.11 newest-resolvable stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,all]"
          python scripts/ci.py test
          python scripts/ci.py optional
          python scripts/ci.py deps

      - name: Clean build products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build *.egg-info gvc.egg-info

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Python 3.12 full gate
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,all]"
          python scripts/ci.py all
          python scripts/ci.py optional

      - name: Clean build products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build *.egg-info gvc.egg-info

      - name: Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Python 3.13 newest-resolvable stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,all]"
          python scripts/ci.py test
          python scripts/ci.py optional
          python scripts/ci.py deps

      - name: Clean build products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build *.egg-info gvc.egg-info

      - name: Python 3.14 — forward compatibility
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Python 3.14 core
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test]"
          python scripts/ci.py all
