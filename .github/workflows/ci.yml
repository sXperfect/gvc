name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: ["opened", "synchronize", "reopened", "ready_for_review"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python 3.8 core test environment
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -e ".[test]"

      - name: Verify Python 3.8 core-only installation
        run: |
          python scripts/ci.py metadata
          python scripts/ci.py syntax
          python scripts/ci.py native
          python scripts/ci.py test
          python scripts/ci.py cli

      - name: Install Python 3.8 optional dependencies
        run: python -m pip install -e ".[all]"

      - name: Verify Python 3.8 optional dependency ceiling
        run: python scripts/ci.py dependencies

      - name: Clean Python 3.8 native products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and test Python 3.9
        run: |
          python -m pip install -e ".[all,test]"
          python scripts/ci.py test
          python scripts/ci.py cli
          python scripts/ci.py dependencies

      - name: Clean Python 3.9 native products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and test Python 3.10
        run: |
          python -m pip install -e ".[all,test]"
          python scripts/ci.py test
          python scripts/ci.py cli
          python scripts/ci.py dependencies

      - name: Clean Python 3.10 native products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and test Python 3.11
        run: |
          python -m pip install -e ".[all,test]"
          python scripts/ci.py test
          python scripts/ci.py cli
          python scripts/ci.py dependencies

      - name: Clean Python 3.11 native products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and test Python 3.12
        run: |
          python -m pip install -e ".[all,test]"
          python scripts/ci.py test
          python scripts/ci.py cli
          python scripts/ci.py dependencies
