name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: ["opened", "synchronize", "reopened", "ready_for_review"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify reviewed Python 3.8 latest stack
        run: |
          python -m venv .venv-py38-reviewed
          . .venv-py38-reviewed/bin/activate
          python -m pip install --upgrade "pip<25.1"
          PIP_CONSTRAINT=ci/constraints/py38-latest.txt \
            python -m pip install --upgrade --upgrade-strategy eager -e ".[test,all]"
          python scripts/check_py38_latest.py
          python scripts/ci.py all
          python scripts/ci.py optional
          deactivate

      - name: Clean reviewed Python 3.8 products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build *.egg-info gvc.egg-info

      - name: Verify Python 3.8 resolver has not moved
        run: |
          python -m venv .venv-py38-resolver
          . .venv-py38-resolver/bin/activate
          python -m pip install --upgrade "pip<25.1"
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,all]"
          python scripts/check_py38_latest.py
          python -m pytest
          python scripts/ci.py optional
          deactivate

      - name: Clean Python 3.8 products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build *.egg-info gvc.egg-info

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Python 3.9 newest-resolvable stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,all]"
          python scripts/ci.py test
          python scripts/ci.py optional
          python scripts/ci.py deps

      - name: Clean Python 3.9 products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build *.egg-info gvc.egg-info

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Python 3.10 full gate
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,all]"
          python scripts/ci.py all
          python scripts/ci.py optional

      - name: Clean Python 3.10 products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build *.egg-info gvc.egg-info

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Python 3.11 newest-resolvable stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,all]"
          python scripts/ci.py test
          python scripts/ci.py optional
          python scripts/ci.py deps

      - name: Clean Python 3.11 products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build *.egg-info gvc.egg-info

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Python 3.12 full gate
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,all]"
          python scripts/ci.py all
          python scripts/ci.py optional

      - name: Clean Python 3.12 products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build *.egg-info gvc.egg-info

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Python 3.13 newest-resolvable stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,all]"
          python scripts/ci.py test
          python scripts/ci.py optional
          python scripts/ci.py deps

      - name: Clean Python 3.13 products
        run: |
          find gvc -name '*.so' -delete
          rm -rf build tmp/libgvc-build *.egg-info gvc.egg-info

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Python 3.14 full current stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,all]"
          python scripts/ci.py all
          python scripts/ci.py optional
