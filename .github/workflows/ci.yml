name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: ["opened", "synchronize", "reopened", "ready_for_review"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.8
        uses: actions/setup-python@v7
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python 3.8 test environment
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -e ".[test]"

      - name: Run Python 3.8 canonical gate
        run: python scripts/ci.py all

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python 3.10 compatibility environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run Python 3.10 compatibility tests
        run: python scripts/ci.py test
