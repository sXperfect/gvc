[build-system]
requires = [
  "setuptools>=65,<70",
  "wheel>=0.38,<0.46",
  "Cython>=0.29.36,<3.0",
  "numpy>=1.21,<1.25; python_version < '3.9'",
  "numpy>=1.21,<2; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[project]
name = "gvc"
version = "1.0.0"
description = "Genomic Variant Codec for compact genotype representation"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "GVC contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.21,<1.25; python_version < '3.9'",
  "numpy>=1.21,<2; python_version >= '3.9'",
  "scipy>=1.7,<1.11; python_version < '3.9'",
  "scipy>=1.7,<2; python_version >= '3.9'",
]

[project.optional-dependencies]
vcf = ["cyvcf2>=0.30"]
speed = ["numba>=0.56"]
test = ["pytest>=7.4,<8.4"]
dev = ["pytest>=7.4,<8.4", "ruff>=0.6,<0.14"]

[project.scripts]
gvc = "gvc.__main__:main"

[project.urls]
Source = "https://github.com/sXperfect/gvc"
Issues = "https://github.com/sXperfect/gvc/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gvc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
