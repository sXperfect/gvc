[build-system]
requires = [
  "setuptools>=65,<70",
  "wheel>=0.38,<0.46",
  "Cython>=0.29.36,<3.0",
  "numpy>=1.21,<1.25; python_version < '3.9'",
  "numpy>=1.21,<2; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[project]
name = "gvc"
dynamic = ["version"]
description = "Genomic Variant Codec"
readme = "README.md"
requires-python = ">=3.8,<3.13"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.21,<1.25; python_version < '3.9'",
  "numpy>=1.21,<2; python_version >= '3.9'",
  "scipy>=1.7,<1.11; python_version < '3.9'",
  "scipy>=1.7,<2; python_version >= '3.9'",
]

[project.optional-dependencies]
vcf = [
  "cyvcf2>=0.31.4,<0.32; python_version < '3.9'",
  "cyvcf2>=0.34,<0.35; python_version >= '3.9'",
]
speed = [
  "numba>=0.57.1,<0.58; python_version < '3.9'",
  "numba>=0.60,<0.61; python_version == '3.9'",
  "numba>=0.67,<0.68; python_version >= '3.10'",
]
test = [
  "pytest>=8.3,<8.4; python_version < '3.9'",
  "pytest>=8.4,<9; python_version == '3.9'",
  "pytest>=9.1,<10; python_version >= '3.10'",
]
all = [
  "cyvcf2>=0.31.4,<0.32; python_version < '3.9'",
  "cyvcf2>=0.34,<0.35; python_version >= '3.9'",
  "numba>=0.57.1,<0.58; python_version < '3.9'",
  "numba>=0.60,<0.61; python_version == '3.9'",
  "numba>=0.67,<0.68; python_version >= '3.10'",
]

[project.urls]
Repository = "https://github.com/sXperfect/gvc"
Upstream = "https://github.com/tnt-LUH/gvc"

[tool.setuptools.dynamic]
version = { attr = "gvc._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["gvc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
